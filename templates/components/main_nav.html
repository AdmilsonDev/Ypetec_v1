{% load static %}
<nav class="main-nav" id="main-nav" aria-label="Navegação principal">
  <ul class="main-nav__list">
    {% for item in nav_items %}
      {% if item.children %}
        <li class="main-nav__item main-nav__item--dropdown" data-nav-dropdown>
          <button class="main-nav__link main-nav__toggle{% if item.active %} is-active{% endif %}" type="button" aria-expanded="false" aria-controls="nav-submenu-{{ item.name }}" aria-haspopup="true">
            {{ item.label }}
            <img class="main-nav__chevron" src="{% static 'images/nav-chevron.svg' %}" alt="" width="10.25" height="6.27">
          </button>
          {% if item.active %}
            <img class="main-nav__underline" src="{% static 'images/icons/nav-underline.svg' %}" alt="" width="87.6" height="5">
          {% endif %}
          <ul class="main-nav__submenu" id="nav-submenu-{{ item.name }}" hidden>
            {% for child in item.children %}
              <li>
                <a class="main-nav__sublink{% if child.active %} is-active{% endif %}" href="{% url child.route %}"{% if child.active %} aria-current="page"{% endif %}>{{ child.label }}</a>
              </li>
            {% endfor %}
          </ul>
        </li>
      {% else %}
        <li class="main-nav__item">
          <a class="main-nav__link{% if item.active %} is-active{% endif %}" href="{% url item.route %}"{% if item.active %} aria-current="page"{% endif %}>
            {{ item.label }}
          </a>
          {% if item.active %}
            <img class="main-nav__underline" src="{% static 'images/icons/nav-underline.svg' %}" alt="" width="87.6" height="5">
          {% endif %}
        </li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
